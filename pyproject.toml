[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-retirement-planner"
version = "0.1.0"
description = "Local-first deterministic retirement planning app."
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14.0",
    "fastapi>=0.115.0",
    "pydantic>=2.8.0",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "coverage>=7.0.0",
    "hypothesis>=6.100.0",
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[tool.setuptools.packages.find]
where = ["packages", "apps/api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages", "apps/api"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["packages/planner_engine", "apps/api/app", "packages/irs_data"]
explicit_package_bases = true
mypy_path = ["packages", "apps/api"]
